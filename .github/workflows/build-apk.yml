name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release NotePad Vault APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.jks -alias notepadvault -keyalg RSA -keysize 2048 -validity 10000 -storepass androidreleasekey -keypass androidreleasekey -dname "CN=NotePadVault, OU=Mobile, O=NotePadVault, L=Global, S=Global, C=US"

    - name: Generate Wrapper & Build Release APK
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace
        mkdir -p release-output
        cp app/build/outputs/apk/release/*.apk release-output/NotePad-Vault-Release.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NotePad-Vault-Release-APK
        path: release-output/NotePad-Vault-Release.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Note Pad with Password v1.0.0"
        body: |
          ### 🔐 Note Pad with Password (Vault) - v1.0.0
          
          Native Kotlin Android App built with Jetpack Compose & Encrypted Storage!
          
          **Features:**
          - 🔒 Master Password / Vault protection
          - 🛡️ AES-256 encrypted note storage (Android Jetpack Security)
          - 📝 Rich Note creation, viewing, and fast search
          - 🔑 In-app password change and instant lock
          - 🎨 Sleek modern Dark UI
          
          Download the signed APK directly below!
        draft: false
        prerelease: false
        files: |
          release-output/NotePad-Vault-Release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
